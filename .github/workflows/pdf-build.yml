name: Build PDF

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert_via_pandoc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile Markdown to PDF
        uses: docker://pandoc/latex:latest
        with:
          args: cv.md -o cv.pdf --pdf-engine=xelatex -V geometry:margin=0.75in -V linestretch=1.15

      - name: Commit compiled PDF
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -m "Auto-compile PDF from Markdown [skip ci]" || echo "No changes to commit"
          git push
