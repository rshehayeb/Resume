name: Compile Markdown to PDF
        uses: docker://pandoc/latex:latest
        with:
          args: cv.md -o cv.pdf --pdf-engine=xelatex -V geometry:margin=0.75in

on:
  push:
    branches: [ main ]
    paths:
      - 'cv.md' # Only run when cv.md changes to prevent infinite build loops

permissions:
  contents: write # Grants permission to commit cv.pdf back to the repo

jobs:
  convert_via_pandoc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile Markdown to PDF
        uses: docker://pandoc/latex:latest
        with:
          args: cv.md -o cv.pdf --pdf-engine=xelatex

      - name: Commit compiled PDF
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -m "Auto-compile PDF from Markdown [skip ci]" || echo "No changes to commit"
          git push
